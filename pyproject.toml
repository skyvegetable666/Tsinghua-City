[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tsinghua-city"
version = "0.1.0"
description = "Authoritative world state and MCP capabilities for agent-society experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "pydantic>=2.8,<3",
  "mcp>=1.2,<2",
  "psutil>=5.9,<8",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4"]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[project.scripts]
tsinghua-city = "tsinghua_city.cli:main"

[tool.setuptools.packages.find]
include = ["tsinghua_city*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# FastAPI uses Depends()/Header() in defaults as its declarative dependency
# style; B008 is intentionally ignored for this project.
ignore = ["BLE001", "S110", "B008"]
