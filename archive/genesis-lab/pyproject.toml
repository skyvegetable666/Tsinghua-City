[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-lab"
version = "0.4.0"
description = "A supervisor and thin Python SDK for isolated Claude Code agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9,<4"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "mcp>=1.2,<2",
  "ruff>=0.8",
  "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
include = ["genesis*", "supervisor*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: runs against the real claude CLI and is skipped unless GENESIS_RUN_CLI_TESTS=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Defensive boundaries (hook/claude/network) intentionally swallow broad
# exceptions: a failed telemetry or cleanup path must never break an agent turn.
ignore = ["BLE001", "S110"]
